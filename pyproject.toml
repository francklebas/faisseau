[project]
name = "revue-du-matin"
version = "0.1.0"
description = "Revue du matin : agrégateur de presse française par recoupement des sources"
requires-python = ">=3.11,<3.14"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "transformers>=4.40",
]

[project.scripts]
revue = "revue.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revue"]

# PyTorch en version CPU uniquement : évite ~2 Go de bibliothèques CUDA inutiles.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "modele: test d'intégration qui charge le vrai modèle d'embeddings (lent, téléchargement au premier passage)",
]
