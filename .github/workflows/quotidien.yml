# Passage quotidien de la Revue quotidienne : collecte, regroupement, extraction des faits,
# génération du site et publication sur Cloudflare (Workers Static Assets).
#
# Même enchaînement que l'unité systemd de deploy/ : `make quotidien` puis `make deployer`.
# Si Mistral est injoignable, `revue executer --exiger-llm` sort en erreur, rien n'est
# publié et le site de la veille reste en ligne.
#
# État conservé d'un passage à l'autre : le dossier data/ (base SQLite, éditions, couvertures)
# est repris de l'artefact « donnees » du dernier passage, puis réécrit. Sans lui, les
# archives du site se videraient et tous les articles de la fenêtre seraient réencodés.
#
# Secrets attendus : MISTRAL_API_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

name: Revue quotidienne

on:
  schedule:
    # Le cron d'Actions est en UTC. 6 h à Paris = 5 h UTC en hiver, 4 h UTC en été :
    # on se réveille aux deux heures et l'étape « Heure de Paris » n'en laisse passer qu'une.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier sur Cloudflare à la fin"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read   # lecture de l'artefact du passage précédent

# Jamais deux passages en même temps (l'artefact de données serait écrit deux fois).
concurrency:
  group: revue-du-matin
  cancel-in-progress: false

env:
  REVUE_FILS_CPU: "4"            # cœurs du runner standard
  HF_HOME: ${{ github.workspace }}/.cache/huggingface

jobs:
  quotidien:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Heure de Paris
        id: heure
        run: |
          heure=$(TZ=Europe/Paris date +%H)
          echo "Il est ${heure} h à Paris (déclencheur : ${{ github.event_name }})"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$heure" != "06" ]; then
            echo "passer=true" >> "$GITHUB_OUTPUT"
          else
            echo "passer=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.heure.outputs.passer == 'false'

      - name: Données du passage précédent
        if: steps.heure.outputs.passer == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=donnees&per_page=5" \
                 --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then
            echo "Aucun artefact « donnees » : premier passage, le dossier data/ part vide."
          else
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > /tmp/donnees.zip
            unzip -q -o /tmp/donnees.zip -d data
            echo "Artefact ${id} restauré :" && ls -la data data/editions | head -40
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.heure.outputs.passer == 'false'
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: pnpm/action-setup@v4
        if: steps.heure.outputs.passer == 'false'
        with:
          version: 12.10.1   # même version qu'en local (pnpm -v)

      - uses: actions/setup-node@v4
        if: steps.heure.outputs.passer == 'false'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache des modèles (Solon, mDeBERTa)
        if: steps.heure.outputs.passer == 'false'
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ hashFiles('config/reglages.yaml') }}
          restore-keys: hf-

      - name: Installation
        if: steps.heure.outputs.passer == 'false'
        run: |
          uv sync --frozen
          cd web && pnpm install --frozen-lockfile

      - name: Pipeline et génération du site
        if: steps.heure.outputs.passer == 'false'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: make quotidien

      - name: Publication sur Cloudflare
        if: steps.heure.outputs.passer == 'false' && (github.event_name == 'schedule' || inputs.publier)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: make deployer

      # Même si le pipeline a échoué, les articles collectés sont conservés pour demain.
      - name: Sauvegarde des données
        if: steps.heure.outputs.passer == 'false' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: donnees
          path: data
          retention-days: 90
          if-no-files-found: error
          compression-level: 6

      - name: Site généré
        if: steps.heure.outputs.passer == 'false' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/.output/public
          retention-days: 14
          if-no-files-found: ignore
