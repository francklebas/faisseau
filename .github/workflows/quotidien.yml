# Passage quotidien de la Revue quotidienne : collecte, regroupement, extraction des faits,
# génération du site et publication sur Cloudflare (Workers Static Assets).
#
# Même enchaînement que l'unité systemd de deploy/ : `make quotidien` puis `make deployer`.
# Si Mistral est injoignable, `revue executer --exiger-llm` sort en erreur, rien n'est
# publié et le site de la veille reste en ligne.
#
# État conservé d'un passage à l'autre : le dossier data/ (base SQLite, éditions, couvertures)
# est repris de l'artefact « donnees » du dernier passage, puis réécrit. Sans lui, les
# archives du site se videraient et tous les articles de la fenêtre seraient réencodés.
#
# Secrets attendus : MISTRAL_API_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

name: Revue quotidienne

on:
  schedule:
    # Le cron d'Actions est en UTC, souvent en retard de plusieurs heures, et parfois
    # purement et simplement abandonné (surtout à la minute 0, heure de pointe). On se
    # réveille donc toutes les heures de 4 h à 12 h UTC, à une minute décalée : le premier
    # réveil qui aboutit écrit l'édition du jour, les suivants la voient et s'arrêtent en
    # quelques secondes (étape « Édition du jour »).
    - cron: "23 4-12 * * *"
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier sur Cloudflare à la fin"
        type: boolean
        default: true
      rejouer:
        description: "Rejouer une édition manquée à cette date (ex. 2026-11-17T06:00:00+01:00), sans collecte"
        type: string
        default: ""

permissions:
  contents: read
  actions: read   # lecture de l'artefact du passage précédent

# Jamais deux passages en même temps (l'artefact de données serait écrit deux fois).
concurrency:
  group: revue-du-matin
  cancel-in-progress: false

env:
  REVUE_FILS_CPU: "4"            # cœurs du runner standard
  HF_HOME: ${{ github.workspace }}/.cache/huggingface

jobs:
  quotidien:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Données du passage précédent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=donnees&per_page=5" \
                 --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then
            echo "Aucun artefact « donnees » : premier passage, le dossier data/ part vide."
          else
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > /tmp/donnees.zip
            unzip -q -o /tmp/donnees.zip -d data
            echo "Artefact ${id} restauré :" && ls -la data data/editions | head -40
          fi

      # Un passage planifié ne fait rien si l'édition du jour (date de Paris) est déjà là :
      # c'est ce qui départage les crons d'été et d'hiver, et ce qui permet de relancer
      # sans risque après un échec. Un lancement à la main passe toujours.
      - name: Édition du jour
        id: garde
        run: |
          jour=$(TZ=Europe/Paris date +%F)
          echo "Date de Paris : ${jour} (déclencheur : ${{ github.event_name }})"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/editions/${jour}.json" ]; then
            echo "L'édition du ${jour} existe déjà, rien à faire."
            echo "passer=true" >> "$GITHUB_OUTPUT"
          else
            echo "passer=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.garde.outputs.passer == 'false'
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: pnpm/action-setup@v4
        if: steps.garde.outputs.passer == 'false'
        with:
          version: 12.10.1   # même version qu'en local (pnpm -v)

      - uses: actions/setup-node@v4
        if: steps.garde.outputs.passer == 'false'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache des modèles (Solon, mDeBERTa)
        if: steps.garde.outputs.passer == 'false'
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ hashFiles('config/reglages.yaml') }}
          restore-keys: hf-

      - name: Installation
        if: steps.garde.outputs.passer == 'false'
        run: |
          uv sync --frozen
          cd web && pnpm install --frozen-lockfile

      - name: Pipeline et génération du site
        if: steps.garde.outputs.passer == 'false'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: make quotidien REFERENCE="${{ inputs.rejouer }}"

      - name: Publication sur Cloudflare
        if: steps.garde.outputs.passer == 'false' && (github.event_name == 'schedule' || inputs.publier)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: make deployer

      # Même si le pipeline a échoué, les articles collectés sont conservés pour demain.
      - name: Sauvegarde des données
        if: steps.garde.outputs.passer == 'false' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: donnees
          path: data
          retention-days: 90
          if-no-files-found: error
          compression-level: 6

      - name: Site généré
        if: steps.garde.outputs.passer == 'false' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/.output/public
          retention-days: 14
          if-no-files-found: ignore
