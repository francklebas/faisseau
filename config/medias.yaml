# Médias suivis par la Revue du matin.
#
# Chaque entrée :
#   id            identifiant stable (ne pas le changer une fois des articles collectés)
#   nom           nom affiché
#   site          page d'accueil
#   flux          un ou plusieurs flux RSS/Atom (titres et extraits uniquement)
#   orientation   extreme-gauche | gauche | centre-gauche | centre | centre-droit
#                 | droite | extreme-droite
#                 (le regroupement en cinq blocs se règle dans reglages.yaml)
#   justification pourquoi ce positionnement (propriété, ligne revendiquée, histoire)
#   statut        a_valider | valide — tant que « a_valider », le site l'affiche comme tel
#   sources       sources externes sur la ligne éditoriale (optionnel). Chaque page a été chargée
#                 le 2026-11-12 et la citation y a été retrouvée mot pour mot. Champs :
#                   url, titre, date (de la source), citation
#                   type     ligne_revendiquee (le média parle de lui-même) | propriete
#                            | etude (analyse de contenu, décision d'un régulateur ou d'un juge)
#                            | presse (un tiers décrit la ligne : fiche eurotopics, presse
#                              professionnelle, Wikipédia)
#                   verdict  confirme | contredit | ne tranche pas — par rapport à « orientation »
#                   note     pour un « contredit » : ce que dit la source
#                 Les verdicts « confirme » et « ne tranche pas » sont une première lecture ;
#                 seuls les « contredit » ont été recontrôlés un par un dans la page.
#                 Une source qui contredit ne change rien toute seule : c'est un point à relire.
#   audience      orientation moyenne du public (optionnel). Information seulement : ce n'est
#                 pas un critère de classement, le public d'un média n'est pas sa ligne.
#   actif         false pour désactiver sans supprimer (optionnel, true par défaut)
#   note          remarque libre (optionnel)
#
# IMPORTANT : tous les positionnements ci-dessous sont des PROPOSITIONS rédigées de
# mémoire à partir d'éléments publics (actionnariat, ligne éditoriale revendiquée,
# histoire du titre). Aucun n'a été validé. Ils sont discutables par nature : un
# positionnement résume mal une rédaction, et diffère souvent entre pages « opinion »
# et pages « information ». À relire un par un avant toute mise en ligne.
#
# Flux testés le 2026-11-11. Les médias dont le flux refuse les robots sont listés en
# bas avec actif: false (on ne contourne pas un refus).

medias:
