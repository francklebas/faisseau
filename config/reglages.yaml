# Réglages de la Revue du matin.
# Tout ce qui est ici peut être modifié sans toucher au code.
# Les secrets (clé Mistral) vont dans .env, jamais ici.

collecte:
  fenetre_heures: 36            # articles pris en compte pour l'édition du jour
  extrait_max_caracteres: 400   # longueur maximale conservée de l'extrait RSS
  delai_secondes: 20            # délai maximal par flux
  connexions_simultanees: 8
  conservation_jours: 14        # purge des articles plus anciens
  user_agent: "RevueDuMatin/0.1 (agregateur RSS ; titres et extraits uniquement)"

embeddings:
  modele: solon                 # clé de la table ci-dessous (surcharge : REVUE_EMBEDDINGS)
  fils_cpu: 4                   # nombre de fils PyTorch (limite la chauffe)
  lot: 32
  modeles:
    solon:
      nom: OrdalieTech/Solon-embeddings-base-0.1
      prefixe: ""               # Solon : pas de préfixe pour une comparaison symétrique
      seuil: 0.58               # similarité cosinus moyenne minimale pour fusionner
      # Similarité minimale entre un fait et une phrase d'article pour dire que l'article
      # énonce le fait (en plus du contrôle lexical ; les chiffres doivent concorder).
      # Propre à chaque modèle. Retirer la ligne pour s'en tenir au contrôle lexical.
      seuil_faits: 0.75
    e5-small:
      nom: intfloat/multilingual-e5-small
      prefixe: "query: "        # E5 : même préfixe des deux côtés
      seuil: 0.88
      # pas de seuil_faits : non calibré pour E5, dont les similarités sont très tassées

regroupement:
  liaison: average              # average | complete (complete = plus strict)
  min_medias: 3                 # un sujet = au moins 3 médias distincts
  max_sujets: 30                # sujets publiés par édition (les plus couverts)
  max_asymetries: 8             # sujets les plus asymétriques ajoutés au-delà de ce classement
  max_articles_par_media: 3     # au-delà, on garde les plus proches du centre du sujet

faits:
  fournisseur: mistral          # mistral | koboldcpp | aucun (surcharge : REVUE_LLM) ; pas de repli automatique
  temperature: 0.1
  max_jetons: 900
  delai_secondes: 600
  max_articles_par_sujet: 12    # articles transmis au LLM (un par média d'abord)
  extrait_max_llm: 240          # longueur de l'extrait transmis au LLM (coût, vitesse)
  part_majorite: 0.5            # « fait commun » = au moins cette part des médias du sujet
  ancrage_min: 0.5              # part des mots du fait à retrouver dans une source citée
  ancrage_ajout: 0.7            # au-delà, une source non citée par le LLM est ajoutée
  # Contrôle du niveau « commun » : un candidat ne garde que les sources dont la phrase la plus
  # proche l'affirme, selon un modèle d'implication textuelle local. Comparé à la proximité
  # de vecteurs sur 77 paires relues (scripts/comparer_controles.py). Retirer le bloc pour
  # s'en passer.
  implication:
    modele: MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7
    seuil: 0.5                  # probabilité d'implication ; non ajusté sur le jeu de référence
  fournisseurs:
    mistral:
      url: https://api.mistral.ai/v1
      modele: mistral-small-latest
      variable_cle: MISTRAL_API_KEY
    koboldcpp:
      url: http://localhost:5001/v1   # surcharge : KOBOLDCPP_URL
      modele: koboldcpp               # ignoré par KoboldCpp (modèle chargé au lancement)

couverture:
  # Regroupement des nuances de medias.yaml en cinq blocs affichés. Centre-gauche et
  # centre-droit ont leur propre bloc : la barre de couverture et la comparaison des deux
  # bords parlent ainsi de la même « gauche » et de la même « droite ».
  blocs:
    gauche: [extreme-gauche, gauche]
    centre-gauche: [centre-gauche]
    centre: [centre]
    centre-droit: [centre-droit]
    droite: [droite, extreme-droite]
  asymetrie:
    # Un sujet est-il couvert autant par les médias de gauche que par ceux de droite ?
    # On compare la part des médias de chaque bord qui en parlent (3 médias de gauche sur 7
    # = 43 %), pas leur nombre : les deux bords n'ont pas le même effectif. Les deux bords
    # sont les blocs « gauche » et « droite » ci-dessus ; les trois blocs du milieu ne
    # comptent pour aucun, sinon deux généralistes modérés suffisent à faire pencher un sujet.
    # En dessous de ces deux seuils, l'écart n'est pas affiché (bruit) :
    ecart_min: 0.25             # écart minimal entre les deux parts (0,25 = 25 points)
    min_medias_bord: 2          # le bord dominant doit compter au moins 2 médias sur le sujet
    # Ce qui fausse la comparaison sans rien dire d'un choix éditorial : les médias des deux
    # bords n'ont ni les mêmes rubriques ni le même débit de dépêches.
    ecarter:
      # Sujet de sport : au moins cette part de ses articles est rangée dans une rubrique
      # sportive (segment de l'adresse de l'article). Le sujet n'est pas classé.
      rubriques_sport: [sport, sports, football, foot, rugby, tennis, basket, basketball, cyclisme, handball, f1, formule-1, jo, sport-rugby, ligue-des-nations, ligue-1, ligue-des-champions]
      part_sport: 0.5
      # Dépêche reprise : un article dont le titre est presque identique à celui d'un autre
      # média du sujet (part de mots communs). Il ne compte pas pour son bord ; un média
      # compte seulement s'il publie au moins un article au titre propre.
      titre_repris: 0.75

affinites:
  # Contrôle du classement par la couverture (commande : revue affinites). Signale les
  # médias qui couvrent plutôt les sujets d'un autre bloc que le leur. Ne classe rien.
  min_editions: 14              # en dessous, le rapport se déclare non concluant
  min_sujets: 20                # un média avec moins de sujets n'est pas comparé
  marge: 0.05                   # avance minimale d'un autre bloc pour signaler un média
